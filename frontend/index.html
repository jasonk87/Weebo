<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <div id="sidebar-header">
                <h1>AI Assistant</h1>
                <button id="new-chat-btn">+ New Chat</button>
            </div>
            <div id="chat-list">
                <!-- Chat history items will be populated here by script.js -->
            </div>
        </aside>
        <main id="main-content">
            <div id="weebo-container">
                <div id="weebo">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div id="greeting-bubble" class="hidden">
                    <p id="greeting-message"></p>
                    <div id="greeting-actions">
                        <button id="greeting-yes">Yes</button>
                        <button id="greeting-no">No</button>
                    </div>
                </div>
            </div>
            <div id="chat-container">
                <div id="chat-box">
                    <!-- This is a welcome message, shown when no chat is selected or a new chat is created -->
                    <div id="welcome-message">
                        <h2>Your Personal AI Assistant</h2>
                        <p>Start a new conversation by typing your message below.</p>
                    </div>
                </div>
                <div id="typing-indicator" style="display: none;">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div id="input-container">
                    <input type="text" id="user-input" placeholder="Type your message...">
                    <button id="send-button">Send</button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
