<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <div id="sidebar-header">
                <h1>AI Assistant</h1>
                <button id="new-chat-button">New Chat</button>
            </div>
            <div id="session-list-container">
                <ul id="session-list">
                    <!-- Session items will be dynamically inserted here -->
                </ul>
            </div>
        </aside>
        <main id="main-content">
            <div id="chat-container">
                <div id="proactive-greeting" class="hidden">
                    <p id="proactive-message"></p>
                    <div id="proactive-actions">
                        <button id="proactive-yes">Let's continue</button>
                        <button id="proactive-no">Start a new chat</button>
                    </div>
                </div>
                <div id="welcome-message" class="hidden">
                    <h2>Your Personal AI Assistant</h2>
                    <p>Start a new conversation by typing your message below.</p>
                </div>
                <div id="chat-box">
                    <!-- Chat messages will be appended here -->
                </div>
                <div id="typing-indicator" style="display: none;">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div id="input-container">
                    <input type="text" id="user-input" placeholder="Type your message...">
                    <button id="send-button">Send</button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
